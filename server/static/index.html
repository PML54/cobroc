<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobroc — Nouvelle visite</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --primary: #b5651d;
    --primary-dark: #8b4513;
    --text: #2d2520;
    --muted: #888;
    --border: #d9d0c4;
    --focus: #b5651d;
    --danger: #c0392b;
    --success: #27ae60;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 16px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .year-select {
    padding: 6px 10px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--primary-dark);
    cursor: pointer;
  }
  .year-select:focus { outline: none; border-color: var(--focus); }

  .nav-btn {
    padding: 5px 11px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--primary-dark);
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
    transition: background 0.15s;
  }
  .nav-btn:hover:not(:disabled) { background: #ede8e0; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 18px;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* Visiteur toggle */
  .toggle-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .toggle-btn {
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--muted);
  }

  .toggle-btn.active {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
  }

  /* Duo (visite faite à 2) : bascule Non / Oui, plus compacte que Visiteur */
  .duo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .duo-row > span { font-weight: 600; color: var(--muted); min-width: 3em; }
  .duo-row .toggle-group { flex: 1; }
  .duo-row .toggle-btn { padding: 8px; font-size: 0.95rem; }

  /* Form elements */
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
    margin-top: 14px;
  }

  label:first-of-type { margin-top: 0; }

  input[type="text"],
  input[type="date"],
  input[type="number"],
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--focus);
    background: white;
  }

  input[type="date"],
  input[type="time"] {
    font-size: 0.88rem;
    padding: 7px 8px;
    width: 100%;
  }

  textarea {
    resize: vertical;
    min-height: 90px;
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .row3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .row4 {
    display: grid;
    grid-template-columns: 185px 135px auto auto;
    gap: 10px;
    align-items: start;
  }

  /* Autocomplete */
  .autocomplete-wrap {
    position: relative;
  }

  .dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    z-index: 100;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }

  .dropdown.open { display: block; }

  .dropdown-item {
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 0.95rem;
  }

  .dropdown-item:hover, .dropdown-item.focused {
    background: #f5f0ea;
  }

  .dropdown-item .di-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .dropdown-item .di-ville { font-weight: 600; }

  .dropdown-item .di-addr {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .dropdown-item .cp {
    font-size: 0.78rem;
    color: var(--muted);
    flex-shrink: 0;
  }

  .dropdown-item .visits {
    font-size: 0.72rem;
    color: #bbb;
    flex-shrink: 0;
  }

  .no-lieu-row {
    padding: 10px 14px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .no-lieu-row a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .no-lieu-row a:hover { text-decoration: underline; }

  /* Stars */
  .stars {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }

  .star {
    font-size: 2rem;
    cursor: pointer;
    color: #ddd;
    transition: color 0.1s, transform 0.1s;
    user-select: none;
    line-height: 1;
  }

  .star.on { color: #e8a020; }
  .star:hover { transform: scale(1.15); }

  .star-zero {
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-left: 6px;
    align-self: center;
  }
  .star-zero:hover { background: #f5f0ea; }

  /* Submit */
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 6px;
  }

  .submit-btn:hover { background: var(--primary-dark); }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

  /* Feedback banner */
  #feedback {
    display: none;
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 0.95rem;
    margin-bottom: 14px;
    font-weight: 600;
  }

  #feedback.success {
    background: #eafaf1;
    color: var(--success);
    border: 1px solid #a9dfbf;
    display: block;
  }

  #feedback.error {
    background: #fdedec;
    color: var(--danger);
    border: 1px solid #f5b7b1;
    display: block;
  }

  .agent-note {
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* Details toggle */
  details summary {
    font-size: 0.82rem;
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  details summary::before {
    content: "▶";
    font-size: 0.65rem;
    transition: transform 0.15s;
  }

  details[open] summary::before { transform: rotate(90deg); }
  details summary::-webkit-details-marker { display: none; }

  /* Détail des achats : description + prix distincts */
  #achats-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

  .achat-row {
    display: grid;
    grid-template-columns: minmax(0,1.2fr) 96px minmax(0,0.9fr) 80px 34px;
    gap: 6px;
    align-items: center;
  }

  .achat-vendu-wrap { position: relative; }
  .achat-vendu-wrap::after {
    content: "€";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }
  .achat-vendu { padding-right: 22px !important; }

  .achat-prix-wrap { position: relative; }
  .achat-prix-wrap::after {
    content: "€";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }
  .achat-prix { padding-right: 22px !important; }

  .achat-del {
    width: 34px; height: 38px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--danger);
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
  }
  .achat-del:hover { background: #fdedec; }

  .add-achat {
    margin-top: 10px;
    padding: 8px 12px;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--primary);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .add-achat:hover { background: #fdf5ee; }

  /* Champs lecture seule (couple sélectionné) */
  input.ro {
    background: #efe9e1;
    color: var(--text);
    cursor: default;
  }
  input.ro:focus { border-color: var(--border); background: #efe9e1; }

  /* Groupes de cases à cocher (Endroit, Conditions) */
  .endroit-group, .cond-group {
    display: grid;
    gap: 8px;
    margin-top: 6px;
  }
  .endroit-group { grid-template-columns: repeat(3, 1fr); }
  .cond-group    { grid-template-columns: 1fr 1fr; }
  .qualite-group { display: flex; gap: 16px; flex-wrap: nowrap; margin-top: 6px; }
  .qualite-group .chk { font-size: 0.82rem; white-space: nowrap; }

  /* Ordre de visite — stepper */
  .ordre-stepper {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .ordre-stepper button {
    width: 26px; height: 34px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: transparent;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--primary);
    line-height: 1;
    padding: 0;
  }
  .ordre-stepper button:hover { background: #fdf5ee; }
  .ordre-stepper button:disabled { color: #ccc; cursor: default; }
  .ordre-val {
    min-width: 18px;
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }

  .chk {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    cursor: pointer;
  }
  .chk input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .chk:has(input:checked) {
    border-color: var(--primary);
    background: #fdf5ee;
    color: var(--primary-dark);
  }


  /* Ligne meta d'un résultat de recherche (date · visiteur · note) */
  .dropdown-item .di-meta {
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* Bouton Récents + panel ─────────────────────────────────────────────── */
  .recent-btn {
    margin-left: auto;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 1.1rem;
    cursor: pointer;
    color: var(--primary);
    line-height: 1;
    transition: background 0.15s;
  }
  .recent-btn:hover { background: #fdf5ee; }
  .recent-btn.active { background: #fdf5ee; border-color: var(--primary); }

  /* Lien 📍 vers la page Lieux — même gabarit que .recent-btn */
  a.recent-btn { text-decoration: none; display: inline-flex; align-items: center; }
  a.recent-btn + .recent-btn { margin-left: 0; }

  #recentPanel {
    display: none;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.13);
    margin-bottom: 14px;
    overflow: hidden;
  }
  #recentPanel.open { display: block; }

  #recentPanel .rp-header {
    padding: 10px 14px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  #recentPanel .rp-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  #recentPanel .rp-item:last-child { border-bottom: none; }
  #recentPanel .rp-item:hover { background: #f5f0ea; }

  #recentPanel .rp-date   { font-size: 0.82rem; color: var(--muted); flex-shrink: 0; }
  #recentPanel .rp-name   { font-size: 0.78rem; color: #bbb; flex-shrink: 0; }
  #recentPanel .rp-ville  { font-weight: 600; flex: 0 1 20ch; max-width: 20ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recentPanel .rp-lieu   { font-size: 0.78rem; color: var(--muted); flex-shrink: 0; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recentPanel .rp-expo   { font-size: 0.78rem; color: #bbb; flex-shrink: 0; }
  #recentPanel .rp-note    { font-size: 0.82rem; color: #e8a020; flex-shrink: 0; }
  #recentPanel .rp-avis    { font-size: 0.78rem; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recentPanel .rp-pending { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }

  /* Visite beneficiaire : total revendu > total depense (champ `vendu` du detail) */
  #recentPanel .rp-item.rp-gain .rp-ville { color: #1b7f3b; }
  #recentPanel .rp-item.rp-gain:hover { background: #eef7f0; }
  #recentPanel .rp-marge {
    font-size: 0.78rem; font-weight: 600; color: #1b7f3b;
    flex-shrink: 0; white-space: nowrap;
  }
  /* Visite deficitaire : total revendu < total depense → marge en rouge */
  #recentPanel .rp-item.rp-perte .rp-ville { color: var(--danger); }
  #recentPanel .rp-item.rp-perte:hover { background: #faeceb; }
  #recentPanel .rp-marge.rp-marge-perte { color: var(--danger); }
</style>
</head>
<body>

<div class="top-bar">
  <select id="yearSelect" class="year-select"></select>
  <a class="recent-btn" id="lieuxBtn" href="/static/lieux.html" title="Gérer les lieux">📍</a>
  <button type="button" class="recent-btn" id="recentBtn" title="Visites de l'année">🕐</button>
  <button type="button" class="nav-btn" id="navPrev" title="Visite précédente (date plus récente)" style="display:none">‹</button>
  <button type="button" class="nav-btn" id="navNext" title="Visite suivante (date plus ancienne)" style="display:none">›</button>
</div>

<div id="recentPanel">
  <div class="rp-header" id="recentHeader">Visites de l'année</div>
  <div id="recentList"></div>
</div>

<div id="feedback"></div>


<form id="mainForm" autocomplete="off" novalidate>

  <!-- Visiteur -->
  <div class="card">
    <div class="toggle-group">
      <button type="button" class="toggle-btn" id="btn-pml" onclick="setName('PML')">PML</button>
      <button type="button" class="toggle-btn" id="btn-fra" onclick="setName('FRA')">FRA</button>
    </div>
    <div class="duo-row">
      <span title="Visite faite à 2">Duo</span>
      <div class="toggle-group">
        <button type="button" class="toggle-btn active" id="btn-duo-non" onclick="setDuo(0)">Non</button>
        <button type="button" class="toggle-btn" id="btn-duo-oui" onclick="setDuo(1)">Oui</button>
      </div>
    </div>
  </div>

  <!-- Date + Note + Heure + Ordre -->
  <div class="card">
    <div class="row4">
      <div>
        <label for="hist_date">Date</label>
        <input type="date" id="hist_date" required style="width:100%">
      </div>
      <div>
        <label for="heure_arrivee">Heure</label>
        <input type="time" id="heure_arrivee" autocomplete="off" style="width:100%">
      </div>
      <div>
        <label>Ordre</label>
        <div class="ordre-stepper">
          <button type="button" id="ordre-minus">−</button>
          <span class="ordre-val" id="ordre-display">1</span>
          <button type="button" id="ordre-plus">+</button>
        </div>
      </div>
      <div>
        <label>Note</label>
        <div class="stars" id="stars">
          <span class="star" data-v="1">★</span>
          <span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span>
          <span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
          <span class="star-zero" id="star-zero" title="Remettre à 0">✕</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Lieu -->
  <div class="card">

    <div class="row2">
      <div>
        <label for="loc_q">Ville</label>
        <div class="autocomplete-wrap">
          <input type="text" id="loc_q" name="loc_q" placeholder="Chercher un lieu…"
                 autocomplete="new-password" autocorrect="off" autocapitalize="characters" spellcheck="false"
                 data-1p-ignore data-lpignore="true"
                 readonly onfocus="this.removeAttribute('readonly')">
          <div class="dropdown" id="dropdown"></div>
        </div>
      </div>
      <div>
        <label for="floc">Adresse</label>
        <input type="text" id="floc" name="floc" class="ro" placeholder="—" readonly tabindex="-1">
      </div>
    </div>

    <div class="row2">
      <div>
        <label for="fpc">Code postal</label>
        <input type="number" id="fpc" name="fpc" class="ro" placeholder="—" readonly tabindex="-1">
      </div>
      <div>
        <label for="hist_nb_expo">Nb exposants</label>
        <input type="number" id="hist_nb_expo" placeholder="0" min="0">
      </div>
    </div>

    <label style="margin-top:14px">Conditions</label>
    <div class="cond-group">
      <label class="chk"><input type="checkbox" id="chk_pluie"> Pluie</label>
      <label class="chk"><input type="checkbox" id="chk_tard"> Arrivée trop tard</label>
    </div>

    <label style="margin-top:14px">Endroit</label>
    <div class="endroit-group">
      <label class="chk"><input type="checkbox" id="chk_parking"> Parking</label>
      <label class="chk"><input type="checkbox" id="chk_champ"> Champ</label>
      <label class="chk"><input type="checkbox" id="chk_stade"> Stade</label>
      <label class="chk"><input type="checkbox" id="chk_place"> Place</label>
      <label class="chk"><input type="checkbox" id="chk_rues"> Rues</label>
      <label class="chk"><input type="checkbox" id="chk_salle"> Salle</label>
    </div>
  </div>

  <!-- Qualité -->
  <div class="card">
    <div class="section-title">Qualité</div>
    <div class="qualite-group">
      <label class="chk"><input type="checkbox" id="chk_agreable"> Agréable</label>
      <label class="chk"><input type="checkbox" id="chk_non_signalee"> Non Signalée</label>
      <label class="chk"><input type="checkbox" id="chk_a_faire_a_2"> À faire à 2</label>
    </div>
  </div>

  <!-- Dépenses -->
  <div class="card">
    <div class="section-title">Dépenses (€)</div>
    <div class="row3">
      <div id="dep-visitor-wrap">
        <label id="dep-visitor-label" for="hist_visitor_dep">–</label>
        <input type="number" id="hist_visitor_dep" placeholder="0" min="0">
      </div>
      <div>
        <label for="hist_maison_dep">Maison</label>
        <input type="number" id="hist_maison_dep" placeholder="0" min="0">
      </div>
    </div>
    <!-- champs cachés pour soumission -->
    <input type="hidden" id="hist_pml_dep" value="0">
    <input type="hidden" id="hist_fra_dep" value="0">
  </div>

  <!-- Avis -->
  <div class="card">
    <div class="section-title">Avis</div>
    <textarea id="hist_avis" placeholder="Notes de visite, conseils, observations…"></textarea>

    <details>
      <summary>Détail des achats</summary>
      <div id="achats-list"></div>
      <button type="button" class="add-achat" id="addAchat">＋ Ajouter un objet</button>
    </details>
  </div>

  <button type="submit" class="submit-btn" id="submitBtn">Enregistrer</button>

</form>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let selectedName = null;   // 'PML' | 'FRA'
let selectedDuo  = 0;      // 0 = Non (défaut), 1 = Oui (visite faite à 2)
let selectedGood = 0;
let selectedOrdre = 1;
let selectedLieuId = null; // id du lieu sélectionné dans le dropdown, null si nouveau
let editingId = null;      // id de la visite en cours de modification, null si création
let recentItems = [];      // liste courante du panel (pour navigation ‹ ›)
let currentNavIndex = -1;  // index de l'entrée affichée dans recentItems
let debounceTimer = null;
let dropFocused = -1;
let dropItems = [];

// ── Init ───────────────────────────────────────────────────────────────────
function today() {
  return new Date().toISOString().slice(0, 10);
}
document.getElementById('hist_date').value = today();
document.getElementById('hist_date').addEventListener('change', updateSubmitBtn);
updateSubmitBtn();   // état initial

// Sélecteur d'année (2020 → année courante)
const yearSelect = document.getElementById('yearSelect');
const currentYear = new Date().getFullYear();
for (let y = currentYear; y >= 2009; y--) {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  if (y === currentYear) opt.selected = true;
  yearSelect.appendChild(opt);
}
yearSelect.addEventListener('change', () => openRecentPanel());

// Parse "desc=prix€|avis|vendu+…" → lignes d'achats du formulaire
function fillAchatsFromDetail(detail) {
  achatsList.innerHTML = '';
  const parts = (detail || '').split('+').map(s => s.trim()).filter(Boolean);
  if (!parts.length) { addAchatRow(); return; }
  parts.forEach(part => {
    const [item, avis = '', vendu = ''] = part.split('|');
    const m = item.match(/^(.*)=(\d+)€$/);
    if (m) addAchatRow(m[1].trim(), m[2], avis, vendu);
    else   addAchatRow(item, '', avis, vendu);
  });
}

async function loadEntry(id, navIndex = -1) {
  try {
    const res = await fetch(`/historic/${id}`);
    if (!res.ok) { showFeedback('error', 'Visite introuvable.'); return; }
    const d = await res.json();

    editingId = d.id;
    setName(d.hist_name);
    selectedGood = d.hist_good || 0;
    renderStars();

    document.getElementById('hist_date').value     = d.hist_date || today();
    document.getElementById('heure_arrivee').value = d.heure_arrivee || '';
    document.getElementById('chk_pluie').checked   = d.pluie === 1;
    document.getElementById('chk_tard').checked    = d.arrivee_tard === 1;
    setOrdre(d.ordre || 1);
    document.getElementById('chk_parking').checked = d.endroit_parking === 1;
    document.getElementById('chk_champ').checked   = d.endroit_champ   === 1;
    document.getElementById('chk_stade').checked   = d.endroit_stade   === 1;
    document.getElementById('chk_place').checked   = d.endroit_place   === 1;
    document.getElementById('chk_rues').checked    = d.endroit_rues    === 1;
    document.getElementById('chk_salle').checked        = d.endroit_salle        === 1;
    document.getElementById('chk_agreable').checked     = d.qualite_agreable     === 1;
    document.getElementById('chk_non_signalee').checked = d.qualite_non_signalee === 1;
    document.getElementById('chk_a_faire_a_2').checked  = d.qualite_a_faire_a_2  === 1;
    setDuo(d.duo === 1 ? 1 : 0);

    // Lieu : repris directement depuis l'entrée (pas d'appel /lieux supplémentaire)
    selectedLieuId = d.lieu_id ?? null;
    villeInput.value                      = d.hist_ville || '';
    document.getElementById('fpc').value  = d.hist_code_postal || '';
    document.getElementById('floc').value = d.hist_adresse || '';

    document.getElementById('hist_nb_expo').value    = d.hist_nb_expo || '';
    // dépense visiteur : on charge la valeur du bon champ
    const depVal = d.hist_name === 'FRA' ? (d.hist_fra_dep || '') : (d.hist_pml_dep || '');
    document.getElementById('hist_visitor_dep').value = depVal;
    document.getElementById('hist_pml_dep').value     = d.hist_pml_dep || 0;
    document.getElementById('hist_fra_dep').value     = d.hist_fra_dep || 0;
    document.getElementById('hist_maison_dep').value  = d.hist_maison_dep || '';
    document.getElementById('hist_avis').value       = d.hist_avis || '';
    fillAchatsFromDetail(d.hist_detail);

    enterEditMode(d.id, navIndex);
    updateSubmitBtn();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    showFeedback('error', 'Erreur réseau : ' + err.message);
  }
}

function enterEditMode(id, navIndex = -1) {
  editingId = id;
  currentNavIndex = navIndex;
  document.getElementById('submitBtn').textContent = 'Mettre à jour';
  updateNavBtns();
}

function exitEditMode() {
  editingId = null;
  currentNavIndex = -1;
  document.getElementById('submitBtn').textContent = 'Enregistrer';
  updateNavBtns();
}

function updateNavBtns() {
  const prev = document.getElementById('navPrev');
  const next = document.getElementById('navNext');
  const visible = editingId !== null && recentItems.length > 0 && currentNavIndex >= 0;
  prev.style.display = visible ? '' : 'none';
  next.style.display = visible ? '' : 'none';
  if (visible) {
    prev.disabled = currentNavIndex <= 0;
    next.disabled = currentNavIndex >= recentItems.length - 1;
  }
}

document.getElementById('navPrev').addEventListener('click', () => {
  if (currentNavIndex > 0) {
    const item = recentItems[currentNavIndex - 1];
    loadEntry(item.id, currentNavIndex - 1);
  }
});
document.getElementById('navNext').addEventListener('click', () => {
  if (currentNavIndex < recentItems.length - 1) {
    const item = recentItems[currentNavIndex + 1];
    loadEntry(item.id, currentNavIndex + 1);
  }
});


// ── Ordre (stepper) ────────────────────────────────────────────────────────
function setOrdre(n) {
  selectedOrdre = Math.min(5, Math.max(1, n || 1));
  document.getElementById('ordre-display').textContent = selectedOrdre;
  document.getElementById('ordre-minus').disabled = selectedOrdre <= 1;
  document.getElementById('ordre-plus').disabled  = selectedOrdre >= 5;
}
document.getElementById('ordre-minus').addEventListener('click', () => setOrdre(selectedOrdre - 1));
document.getElementById('ordre-plus').addEventListener('click',  () => setOrdre(selectedOrdre + 1));
setOrdre(1);

// ── Triplet minimal : grise/dégrise le bouton Enregistrer ─────────────────
function updateSubmitBtn() {
  // Le lieu doit être un lieu existant : selectedLieuId non null (plus de saisie libre)
  const ok = !!selectedName
          && !!document.getElementById('hist_date').value
          && selectedLieuId !== null;
  const btn = document.getElementById('submitBtn');
  btn.disabled = !ok;
  btn.style.opacity = ok ? '' : '0.4';
  btn.style.cursor  = ok ? '' : 'not-allowed';
}

// ── Visiteur ───────────────────────────────────────────────────────────────
function setName(n) {
  selectedName = n;
  document.getElementById('btn-pml').classList.toggle('active', n === 'PML');
  document.getElementById('btn-fra').classList.toggle('active', n === 'FRA');
  document.getElementById('dep-visitor-label').textContent = n || '–';
  updateSubmitBtn();
  autoFillDep();
}

// ── Duo (visite faite à 2) ────────────────────────────────────────────────
function setDuo(v) {
  selectedDuo = v === 1 ? 1 : 0;
  document.getElementById('btn-duo-non').classList.toggle('active', selectedDuo === 0);
  document.getElementById('btn-duo-oui').classList.toggle('active', selectedDuo === 1);
}

// ── Dépenses : auto-calcul depuis le détail des achats ─────────────────────
function sumAchatsPrix() {
  let total = 0;
  achatsList.querySelectorAll('.achat-row').forEach(row => {
    const v = parseInt(row.querySelector('.achat-prix').value) || 0;
    total += v;
  });
  return total;
}

function autoFillDep() {
  const field = document.getElementById('hist_visitor_dep');
  if (!field) return;
  const cur = parseInt(field.value) || 0;
  if (cur === 0) {
    const s = sumAchatsPrix();
    if (s > 0) field.value = s;
  }
}

// Synchronise les champs cachés avant soumission
function syncDepHidden() {
  const val = parseInt(document.getElementById('hist_visitor_dep').value) || 0;
  document.getElementById('hist_pml_dep').value = selectedName === 'PML' ? val : 0;
  document.getElementById('hist_fra_dep').value = selectedName === 'FRA' ? val : 0;
}

// ── Stars ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.star').forEach(s => {
  s.addEventListener('click', () => {
    selectedGood = +s.dataset.v;
    renderStars();
  });
  s.addEventListener('mouseover', () => highlightStars(+s.dataset.v));
  s.addEventListener('mouseout', () => renderStars());
});
document.getElementById('star-zero').addEventListener('click', () => {
  selectedGood = 0; renderStars();
});

function renderStars() {
  document.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('on', +s.dataset.v <= selectedGood);
  });
}

function highlightStars(v) {
  document.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('on', +s.dataset.v <= v);
  });
}

// ── Autocomplete ville ─────────────────────────────────────────────────────
const villeInput = document.getElementById('loc_q');
const dropdown   = document.getElementById('dropdown');

villeInput.addEventListener('input', () => {
  villeInput.value = villeInput.value.toUpperCase();   // force majuscules
  updateSubmitBtn();
  selectedLieuId = null;
  document.getElementById('fpc').value = '';
  document.getElementById('floc').value = '';
  clearTimeout(debounceTimer);
  const q = villeInput.value.trim();
  if (q.length < 1) { closeDropdown(); return; }       // dès la 1re lettre
  debounceTimer = setTimeout(() => fetchVilles(q), 250);
});

villeInput.addEventListener('keydown', e => {
  if (!dropdown.classList.contains('open')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (dropFocused >= 0) selectDropItem(dropFocused); }
  else if (e.key === 'Escape') closeDropdown();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.autocomplete-wrap')) closeDropdown();
});

async function fetchVilles(q) {
  try {
    const res = await fetch(`/lieux?ville=${encodeURIComponent(q)}&sort=visites_desc&limit=8`);
    const data = await res.json();
    renderDropdown(data, q);
  } catch { closeDropdown(); }
}

function renderDropdown(items, q) {
  dropItems = items;
  dropFocused = -1;
  dropdown.innerHTML = '';

  // Aucun résultat : renvoyer vers la page Lieux (la création y est désormais isolée)
  if (!items.length) {
    const none = document.createElement('div');
    none.className = 'no-lieu-row';
    none.innerHTML = `Aucun lieu « <strong>${escapeHtml(q.toUpperCase())}</strong> ».
      <a href="/static/lieux.html?ville=${encodeURIComponent(q.toUpperCase())}&new=1">Créer le lieu →</a>`;
    dropdown.appendChild(none);
    dropdown.classList.add('open');
    return;
  }

  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'dropdown-item';
    const titre = item.nom ? `${escapeHtml(item.nom)} — ${item.ville}` : item.ville;
    const addr  = item.adresse ? escapeHtml(item.adresse) : '—';
    div.innerHTML = `
      <div class="di-top">
        <span class="di-ville">${highlight(titre, q)}</span>
        <span class="cp">${item.code_postal || ''}</span>
      </div>
      <div class="di-addr">
        <span>${addr}</span>
        <span class="visits">${item.nb_visites} visite${item.nb_visites > 1 ? 's' : ''}</span>
      </div>
    `;
    div.addEventListener('click', () => selectDropItem(i));
    dropdown.appendChild(div);
  });

  dropdown.classList.add('open');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function highlight(text, q) {
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0, idx) + '<strong>' + text.slice(idx, idx + q.length) + '</strong>' + text.slice(idx + q.length);
}

// Applique un lieu sélectionné (depuis la liste OU après création dans la modale)
function applyLieu(lieu) {
  selectedLieuId = lieu.id;
  villeInput.value = lieu.ville;
  document.getElementById('fpc').value  = lieu.code_postal || '';
  document.getElementById('floc').value = lieu.adresse || '';
  updateSubmitBtn();
}

function selectDropItem(i) {
  const item = dropItems[i];
  if (!item) return;
  applyLieu(item);
  closeDropdown();
}

function moveFocus(dir) {
  const items = dropdown.querySelectorAll('.dropdown-item');
  items.forEach((el, i) => el.classList.toggle('focused', i === dropFocused));
  dropFocused = Math.max(-1, Math.min(dropItems.length - 1, dropFocused + dir));
  items.forEach((el, i) => el.classList.toggle('focused', i === dropFocused));
}

function closeDropdown() {
  dropdown.classList.remove('open');
  dropFocused = -1;
}

// ── Détail des achats (description + prix distincts) ─────────────────────────
const achatsList = document.getElementById('achats-list');

function addAchatRow(desc = '', prix = '', avis = '', vendu = '') {
  const row = document.createElement('div');
  row.className = 'achat-row';
  row.innerHTML = `
    <input type="text" class="achat-desc" placeholder="Objet…" autocomplete="off"
           spellcheck="false" data-1p-ignore data-lpignore="true" value="${escapeHtml(desc)}">
    <div class="achat-prix-wrap">
      <input type="number" class="achat-prix" placeholder="0" min="0" step="1"
             inputmode="numeric" autocomplete="off" value="${escapeHtml(prix)}">
    </div>
    <input type="text" class="achat-avis" placeholder="Avis…" autocomplete="off"
           spellcheck="false" value="${escapeHtml(avis)}">
    <div class="achat-vendu-wrap">
      <input type="number" class="achat-vendu" placeholder="0" min="0" step="1"
             inputmode="numeric" autocomplete="off" value="${escapeHtml(vendu)}">
    </div>
    <button type="button" class="achat-del" title="Retirer cet objet">✕</button>
  `;
  row.querySelector('.achat-del').addEventListener('click', () => {
    row.remove();
    if (!achatsList.querySelector('.achat-row')) addAchatRow();
    autoFillDep();
  });
  row.querySelector('.achat-prix').addEventListener('input', () => {
    const dep = document.getElementById('hist_visitor_dep');
    if (!dep || parseInt(dep.value) > 0) return;  // ne recalcule que si vide
    autoFillDep();
  });
  achatsList.appendChild(row);
}

// Format hist_detail : "desc=prix€|avis|vendu+…"  (| intra-item, + inter-items)
// Rétrocompatible : anciens items sans | sont parsés normalement.
function buildDetail() {
  const parts = [];
  achatsList.querySelectorAll('.achat-row').forEach(row => {
    const desc  = row.querySelector('.achat-desc').value.trim();
    const prix  = row.querySelector('.achat-prix').value.trim();
    const avis  = row.querySelector('.achat-avis').value.trim();
    const vendu = row.querySelector('.achat-vendu').value.trim();
    if (!desc && !prix) return;
    let s = prix ? `${desc}=${prix}€` : desc;
    if (avis || vendu) s += `|${avis}|${vendu}`;
    parts.push(s);
  });
  return parts.join('+');
}

function resetAchats() {
  achatsList.innerHTML = '';
  addAchatRow();
}

document.getElementById('addAchat').addEventListener('click', () => addAchatRow());
addAchatRow();   // une ligne vide au départ

// ── Submit ─────────────────────────────────────────────────────────────────
document.getElementById('mainForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!validate()) return;
  syncDepHidden();

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  const ville       = villeInput.value.trim().toUpperCase();
  const code_postal = parseInt(document.getElementById('fpc').value) || 0;
  const adresse     = document.getElementById('floc').value.trim();
  const lieu_id     = selectedLieuId;

  const body = {
    hist_name:        selectedName,
    hist_date:        document.getElementById('hist_date').value,
    hist_good:        selectedGood,
    hist_ville:       ville,
    hist_code_postal: code_postal,
    hist_adresse:     adresse,
    hist_nb_expo:     parseInt(document.getElementById('hist_nb_expo').value) || 0,
    hist_pml_dep:     parseInt(document.getElementById('hist_pml_dep').value) || 0,
    hist_fra_dep:     parseInt(document.getElementById('hist_fra_dep').value) || 0,
    hist_maison_dep:  parseInt(document.getElementById('hist_maison_dep').value) || 0,
    hist_avis:        document.getElementById('hist_avis').value.trim(),
    hist_detail:      buildDetail(),
    lieu_id,
    heure_arrivee:    document.getElementById('heure_arrivee').value,
    pluie:            document.getElementById('chk_pluie').checked    ? 1 : 0,
    arrivee_tard:     document.getElementById('chk_tard').checked     ? 1 : 0,
    ordre:            selectedOrdre,
    endroit_parking:  document.getElementById('chk_parking').checked  ? 1 : 0,
    endroit_champ:    document.getElementById('chk_champ').checked    ? 1 : 0,
    endroit_stade:    document.getElementById('chk_stade').checked    ? 1 : 0,
    endroit_place:    document.getElementById('chk_place').checked    ? 1 : 0,
    endroit_rues:     document.getElementById('chk_rues').checked     ? 1 : 0,
    endroit_salle:         document.getElementById('chk_salle').checked        ? 1 : 0,
    qualite_agreable:      document.getElementById('chk_agreable').checked     ? 1 : 0,
    qualite_non_signalee:  document.getElementById('chk_non_signalee').checked ? 1 : 0,
    qualite_a_faire_a_2:   document.getElementById('chk_a_faire_a_2').checked  ? 1 : 0,
    duo:                   selectedDuo,
  };

  const isEdit = editingId !== null;

  try {
    const res = await fetch(isEdit ? `/historic/${editingId}` : '/historic', {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await res.json();

    if (res.ok) {
      exitEditMode();
      resetForm();
    } else {
      const msg = data.detail || JSON.stringify(data);
      showFeedback('error', `Erreur : ${msg}`);
    }
  } catch (err) {
    showFeedback('error', `Erreur réseau : ${err.message}`);
  }

  btn.disabled = false;
  btn.textContent = editingId !== null ? 'Mettre à jour' : 'Enregistrer';
});

function validate() {
  // Triplet obligatoire : Visiteur + Date + Lieu (lieu existant, sélectionné dans la liste)
  const missing = [];
  if (!selectedName)                                   missing.push('Visiteur');
  if (!document.getElementById('hist_date').value)     missing.push('Date');
  if (selectedLieuId === null)                         missing.push('Lieu');

  if (missing.length) {
    let msg = `Champ(s) obligatoire(s) manquant(s) : <b>${missing.join(', ')}</b>`;
    if (missing.includes('Lieu')) {
      const q = villeInput.value.trim().toUpperCase();
      msg += `<div class="agent-note">Le lieu doit être sélectionné dans la liste.
        <a href="/static/lieux.html${q ? '?ville=' + encodeURIComponent(q) : ''}">Créer ou modifier un lieu →</a></div>`;
    }
    showFeedback('error', msg);
    if (missing.includes('Lieu')) villeInput.focus();
    return false;
  }

  return true;
}

function showFeedback(type, html) {
  const el = document.getElementById('feedback');
  el.className = type;
  el.innerHTML = html;
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Panel Récents ──────────────────────────────────────────────────────────
const recentBtn   = document.getElementById('recentBtn');
const recentPanel = document.getElementById('recentPanel');
const recentList  = document.getElementById('recentList');

recentBtn.addEventListener('click', async () => {
  if (recentPanel.classList.contains('open')) { closeRecentPanel(); return; }
  await openRecentPanel();
});

// Marge d'une visite = somme des `vendu` - somme des prix d'achat.
// Format d'un item : "desc=prix€|avis|vendu" — le vendu peut etre negatif
// (objet revendu a perte / jete) ou absent/0 (non revendu, compte pour 0).
// `revendu` = au moins un objet effectivement revendu (vendu non nul) : c'est
// ce flag qui rend la marge significative (une visite tout-en-perte a une vente
// negative, donc `vente > 0` ne suffit pas a detecter les deficits).
function margeVisite(detail) {
  let achat = 0, vente = 0, revendu = false;
  (detail || '').split('+').forEach(part => {
    const [item, , vendu = ''] = part.split('|');
    const m = item.match(/=(\d+)€\s*$/);
    if (m) achat += parseInt(m[1], 10);
    const v = parseInt(vendu, 10);
    if (!isNaN(v)) {
      vente += v;
      if (v !== 0) revendu = true;
    }
  });
  return { achat, vente, marge: vente - achat, revendu };
}

async function openRecentPanel() {
  recentList.innerHTML = '<div style="padding:12px 14px;color:var(--muted);font-size:0.9rem">Chargement…</div>';
  recentPanel.classList.add('open');
  recentBtn.classList.add('active');
  try {
    const annee = document.getElementById('yearSelect').value;
    document.getElementById('recentHeader').textContent = `Visites ${annee}`;
    const res  = await fetch(`/historic?sort=date_desc&limit=500&year=${annee}`);
    const data = await res.json();
    recentItems = data;   // mémorise pour navigation ‹ ›
    recentList.innerHTML = '';
    data.forEach(item => {
      const div  = document.createElement('div');
      div.className = 'rp-item';
      const note    = item.hist_good ? '★'.repeat(item.hist_good) : '';
      const pending = item.validated ? '' : '<span class="rp-pending">⏳</span>';
      const lieu    = item.hist_adresse ? escapeHtml(item.hist_adresse) : '';
      const expo    = item.hist_nb_expo ? `${item.hist_nb_expo} exp.` : '';
      const { achat, marge, revendu } = margeVisite(item.hist_detail);
      // Benefice / deficit ne sont pertinents que si au moins un objet a ete revendu.
      const beneficiaire = revendu && marge > 0;
      const deficitaire  = revendu && marge < 0;
      // Rien revendu mais des achats : on affiche la depense totale en rouge.
      const depenseSeule = !revendu && achat > 0;
      if (beneficiaire) div.classList.add('rp-gain');
      else if (deficitaire || depenseSeule) div.classList.add('rp-perte');
      div.innerHTML = `
        <span class="rp-date">${item.hist_date}</span>
        <span class="rp-name">${item.hist_name}</span>
        <span class="rp-ville">${escapeHtml(item.hist_ville)}</span>
        ${lieu ? `<span class="rp-lieu">${lieu}</span>` : ''}
        ${expo ? `<span class="rp-expo">${expo}</span>` : ''}
        ${beneficiaire ? `<span class="rp-marge">+${marge}€</span>` : ''}
        ${deficitaire  ? `<span class="rp-marge rp-marge-perte">${marge}€</span>` : ''}
        ${depenseSeule ? `<span class="rp-marge rp-marge-perte">-${achat}€</span>` : ''}
        <span class="rp-note">${note}</span>
        ${item.hist_avis ? `<span class="rp-avis">${escapeHtml(item.hist_avis)}</span>` : ''}
        ${pending}
      `;
      const idx = recentItems.indexOf(item);
      div.addEventListener('click', () => { loadEntry(item.id, idx); closeRecentPanel(); });
      recentList.appendChild(div);
    });
    if (!data.length) {
      recentList.innerHTML = '<div style="padding:12px 14px;color:var(--muted);font-size:0.9rem">Aucune visite.</div>';
    }
  } catch (err) {
    recentList.innerHTML = `<div style="padding:12px 14px;color:var(--danger);font-size:0.9rem">Erreur : ${err.message}</div>`;
  }
}

function closeRecentPanel() {
  recentPanel.classList.remove('open');
  recentBtn.classList.remove('active');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#recentBtn') && !e.target.closest('#recentPanel') && !e.target.closest('#yearSelect')) closeRecentPanel();
});

// Escape déjà géré globalement — on y ajoute closeRecentPanel
const _origKeydown = document.onkeydown;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeRecentPanel();
  // Navigation ‹ › au clavier (seulement hors champ de saisie)
  if (editingId !== null && !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) {
    if (e.key === 'ArrowLeft'  && currentNavIndex > 0)
      loadEntry(recentItems[currentNavIndex - 1].id, currentNavIndex - 1);
    if (e.key === 'ArrowRight' && currentNavIndex < recentItems.length - 1)
      loadEntry(recentItems[currentNavIndex + 1].id, currentNavIndex + 1);
  }
});
